<mat-card class="grafico-card-container">
  <mat-card-header>
    <mat-card-title class="grafico-card-title">Consumo mensal e ocupação</mat-card-title>
  </mat-card-header>

  <mat-card-content class="grafico-card-content">
    @if (dadosConsumo().length > 0) {
      <div class="canvas-container">
        <canvas #graficoConsumoCanvas></canvas>
      </div>
    } @else {
      <div class="empty-state">
        <mat-icon class="empty-state__icon">analytics</mat-icon>
        <p class="empty-state__text">Nenhum dado de consumo encontrado</p>
        <p class="empty-state__subtext">
          Não há horários cadastrados ou vinculados ao seu perfil para gerar o relatório.
        </p>
      </div>
    }
  </mat-card-content>
</mat-card>

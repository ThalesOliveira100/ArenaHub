<mat-form-field appearance="outline" class="selection-bar">
  <mat-select [(value)]="value">

    <mat-option class="selection-bar__opt" value="">{{ label() }}</mat-option>

    @for (option of options(); track option) {
      <mat-option class="selection-bar__opt" [value]="option">{{option}}</mat-option>
    }
  </mat-select>
</mat-form-field>

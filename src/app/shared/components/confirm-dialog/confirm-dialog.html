<h2 mat-dialog-title class="dialog-title">
  <mat-icon [color]="data.corBotao || 'warn'">warning</mat-icon>
  {{ data.titulo }}
</h2>

<mat-dialog-content class="dialog-content">
  <p>{{ data.mensagem }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-stroked-button (click)="cancelar()">
    {{ data.textoCancelar || 'Cancelar' }}
  </button>

  <button mat-raised-button [color]="data.corBotao || 'warn'" (click)="confirmar()">
    {{ data.textoConfirmar || 'Excluir' }}
  </button>
</mat-dialog-actions>
